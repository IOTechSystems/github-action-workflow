name: sonarqube-scan

on:
  workflow_call:
    inputs:
      PROJECT_NAME:
        description: The repository name for SonarQube.
        required: true
        type: string
      USE_PRIVATE_MODULE:
        description: If true, set up the environment for the private go modules.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sonarqube-scan:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: ${{ inputs.USE_PRIVATE_MODULE && 'github.com/IOTechSystems' || '' }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
      # Install Golang
      - uses: actions/setup-go@v7
        with:
          # Retrieve go version from go.mod
          go-version-file: go.mod
      - name: Run unit tests
        env:
          USE_PRIVATE_MODULE: ${{ inputs.USE_PRIVATE_MODULE }}
          JENKINS_PAT: ${{ secrets.JENKINS_PAT }}
        run: |
          if [ "$USE_PRIVATE_MODULE" = "true" ]; then
            git config --global --add "url.https://${JENKINS_PAT}@${GOPRIVATE}/.insteadOf" "https://${GOPRIVATE}/"
            # Remove the credential before the later third-party scan action runs, even if a command below fails.
            trap 'git config --global --remove-section "url.https://${JENKINS_PAT}@${GOPRIVATE}/"' EXIT
          fi
          sudo apt update && sudo apt-get install libzmq3-dev
          make tidy
          make test
      # Reference the master branch of sonarsource/sonarqube-scan-action
      - uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarqube.iotechsys.com/
        with:
          # set sonar.qualitygate.wait=true to fail the job if the Quality Gate is red
          args: >
            -Dsonar.projectKey=${{ inputs.PROJECT_NAME }}
            -Dsonar.qualitygate.wait=true
